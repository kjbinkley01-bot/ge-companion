<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GE Companion</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e0b64a'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' font-family='Arial' font-weight='bold' fill='%23121211'%3EGE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="coin">GE</span><span>Companion</span></div>
  <div class="search-wrap">
    <input id="globalSearch" class="input" type="search" placeholder="Search any item..." autocomplete="off" aria-label="Search items">
    <div id="globalResults" class="picker-list" hidden></div>
  </div>
  <div class="top-right">
    <span id="liveStatus" class="live" title="Price feed status"><span class="dot"></span><span class="txt">Loading</span></span>
    <button id="bell" class="icon-btn" title="Alerts" aria-label="Alerts"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5-6.71V3.5a2 2 0 0 0-4 0v.79A7 7 0 0 0 5 11v5l-2 2v1h18v-1Z"/></svg><span id="bellCount" class="badge" hidden>0</span></button>
    <button id="themeBtn" class="icon-btn" title="Toggle light or dark" aria-label="Toggle theme"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg></button>
  </div>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="networth">Net worth</button>
  <button data-tab="terminal">Terminal</button>
  <button data-tab="flips" class="active">Flip finder</button>
  <button data-tab="market">Market</button>
  <button data-tab="movers">Movers</button>
  <button data-tab="watch">Watchlist</button>
  <button data-tab="news">News</button>
  <button data-tab="alerts">Alerts</button>
  <button data-tab="log">Flip log</button>
  <button data-tab="portfolio">Portfolio</button>
  <button data-tab="money">Money making</button>
  <button data-tab="alch">High alch</button>
  <button data-tab="decant">Decanting</button>
  <button data-tab="forecast">Forecast</button>
  <button data-tab="backtest">Backtest</button>
  <button data-tab="account">Account</button>
  <button data-tab="settings">Settings</button>
</nav>
<main>
  <section id="tab-networth" class="tab" hidden></section>
  <section id="tab-terminal" class="tab" hidden></section>
  <section id="tab-flips" class="tab"></section>
  <section id="tab-market" class="tab" hidden></section>
  <section id="tab-movers" class="tab" hidden></section>
  <section id="tab-watch" class="tab" hidden></section>
  <section id="tab-news" class="tab" hidden></section>
  <section id="tab-alerts" class="tab" hidden></section>
  <section id="tab-log" class="tab" hidden></section>
  <section id="tab-portfolio" class="tab" hidden></section>
  <section id="tab-money" class="tab" hidden></section>
  <section id="tab-alch" class="tab" hidden></section>
  <section id="tab-decant" class="tab" hidden></section>
  <section id="tab-forecast" class="tab" hidden></section>
  <section id="tab-backtest" class="tab" hidden></section>
  <section id="tab-account" class="tab" hidden></section>
  <section id="tab-settings" class="tab" hidden></section>
</main>
<aside id="drawer" class="drawer" hidden aria-label="Item details">
  <div class="drawer-inner" id="drawerBody"></div>
</aside>
<div id="scrim" class="scrim" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="tooltip" class="chart-tip" hidden></div>
<script src="app.js"></script>
</body>
</html>
