plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
// Check for a new RuneLite release at most every 30 minutes, so the desktop shortcut keeps
// the client current after game updates.
configurations.configureEach {
	resolutionStrategy.cacheDynamicVersionsFor 30, 'minutes'
}
def pluginMainClass = 'com.bankstanding.BankstandingPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.42'
	annotationProcessor 'org.projectlombok:lombok:1.18.42'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
	testCompileOnly 'org.projectlombok:lombok:1.18.42'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.42'
}

group = 'com.bankstanding'
version = '1.0.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// Launches RuneLite (developer mode) with this plugin loaded: ./gradlew run
tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea", "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED", "--add-opens=java.base/java.lang=ALL-UNNAMED", "--add-opens=java.desktop/sun.awt=ALL-UNNAMED"
	args "--developer-mode", "--debug"
}

// Renders the side panel outside the game to PNGs (needs a running app, demo mode is fine):
// ./gradlew previewPanel -Papp=http://127.0.0.1:8799 -Pout=build/preview
tasks.register('previewPanel', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.bankstanding.PanelPreview'
	jvmArgs "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED", "--add-opens=java.desktop/sun.awt=ALL-UNNAMED"
	args = [project.findProperty('app') ?: 'http://127.0.0.1:8799', project.findProperty('out') ?: 'build/preview']
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}

